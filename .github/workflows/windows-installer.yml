name: Build apps (Windows, macOS, Linux)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'landing/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Analyze and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter pub get
      - name: flutter analyze
        shell: bash
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt; then
            msg=$(grep -E "error •|error -" analyze.txt | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter analyze errors::${msg}"
            exit 1
          fi
      - name: flutter test
        shell: bash
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test-output.txt; then
            msg=$(grep -nE "\[E\]|Expected:|Actual:|Which:|EXCEPTION|overflowed|Error:|error:|Test failed|══" test-output.txt | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter test failures::${msg}"
            exit 1
          fi

  windows:
    name: Build Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download FFmpeg (static, pinned)
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg_bin | Out-Null
          Copy-Item $bin.FullName ffmpeg_bin\
          $license = Get-ChildItem ffmpeg_tmp -Recurse -Filter LICENSE | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName ffmpeg_bin\LICENSE.txt }
          "$((Resolve-Path ffmpeg_bin).Path)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & ffmpeg_bin\ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - run: flutter pub get

      - name: Unit tests on Windows (includes FFmpeg auto-zoom render)
        run: flutter test test/auto_zoom_test.dart test/windows_recorder_test.dart

      - name: Smoke-test gdigrab capture on the runner desktop
        shell: pwsh
        run: |
          & ffmpeg_bin\ffmpeg.exe -hide_banner -y -f gdigrab -framerate 30 -draw_mouse 1 -offset_x 0 -offset_y 0 -video_size 640x360 -i desktop -t 2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p gdigrab_smoke.mp4
          if (!(Test-Path gdigrab_smoke.mp4)) { Write-Warning "gdigrab smoke capture produced no file" }
        continue-on-error: true

      - name: Build Flutter app
        run: flutter build windows --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}

      - name: Bundle FFmpeg and VC++ runtime next to the app
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force "$rel\ffmpeg" | Out-Null
          Copy-Item ffmpeg_bin\* "$rel\ffmpeg\"
          foreach ($dll in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") {
            Copy-Item "C:\Windows\System32\$dll" $rel
          }
          Get-ChildItem $rel -Recurse | Select-Object FullName, Length

      - name: Set the runner screen to 1920x1080
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class Disp {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll")] public static extern int EnumDisplaySettings(string d, int m, ref DEVMODE dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int f);
            public static int Set(int w, int h) {
              DEVMODE dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
              EnumDisplaySettings(null, -1, ref dm); dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000;
              return ChangeDisplaySettings(ref dm, 0);
            }
          }
          "@
          "ChangeDisplaySettings: " + [Disp]::Set(1920, 1080)
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds

      - name: Screenshot the running app
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
          }
          "@
          [W]::SetProcessDPIAware() | Out-Null
          $demo = (Resolve-Path tool\demo).Path
          $cfg = Join-Path $env:APPDATA "screen_recorder_app"
          function Shot($name, $state) {
            Remove-Item -Recurse -Force $cfg -ErrorAction SilentlyContinue
            $a = @("--allow-capture", "--demo=$state", "--demo-assets=$demo")
            $app = Start-Process "build\windows\x64\runner\Release\screen_recorder_app.exe" -ArgumentList $a -PassThru
            Start-Sleep -Seconds 12
            $app.Refresh()
            $h = $app.MainWindowHandle
            [W]::ShowWindow($h, 3) | Out-Null
            [W]::SetForegroundWindow($h) | Out-Null
            Start-Sleep -Seconds 4
            $r = New-Object W+RECT
            [W]::GetWindowRect($h, [ref]$r) | Out-Null
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
            $x = [Math]::Max($r.L, $b.Left); $y = [Math]::Max($r.T, $b.Top)
            $w = [Math]::Min($r.R, $b.Right) - $x; $hh = [Math]::Min($r.B, $b.Bottom) - $y
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($x, $y, 0, 0, (New-Object System.Drawing.Size $w, $hh))
            $bmp.Save("screenshots\$name.png")
            Stop-Process -Id $app.Id -Force
            Start-Sleep -Seconds 2
          }
          Shot "app-first-run-tour" "tour"
          Shot "app-home" "home"
          Shot "app-compare" "compare"
          Shot "app-export" "export"
          Shot "app-camera" "camera"
          Shot "app-background" "background"
          Shot "app-editor" "edit"
          Get-ChildItem screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" installer\screen_recorder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-Setup
          path: dist/ScreenRecorder-Setup.exe
          if-no-files-found: error

  linux:
    name: Build Linux .deb and .tar.gz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libmpv-dev mpv ffmpeg xvfb x11-utils imagemagick dpkg-dev
      - run: flutter pub get
      - name: Build Flutter app
        run: flutter build linux --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}
      - name: Package .deb and .tar.gz
        run: packaging/linux/package.sh 1.0.${{ github.run_number }} dist
      - name: Install the .deb and start the app (smoke test)
        continue-on-error: true
        run: |
          sudo apt-get install -y ./dist/ScreenRecorder-Linux-x64.deb
          mkdir -p screenshots
          export XDG_SESSION_TYPE=x11
          xvfb-run -a -s "-screen 0 1600x1000x24" bash -c '
            /opt/screen-recorder/screen_recorder_app --demo=home --demo-assets="$PWD/tool/demo" > app.log 2>&1 &
            sleep 15
            import -window root screenshots/linux-home.png
            kill %1 || true
            # x11grab smoke capture of the virtual screen
            ffmpeg -hide_banner -y -f x11grab -framerate 30 -video_size 640x360 -i "$DISPLAY+0,0" -t 2 -c:v libx264 -preset ultrafast -pix_fmt yuv420p x11grab_smoke.mp4
          '
          tail -n 40 app.log || true
          ls -la screenshots x11grab_smoke.mp4 || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/ScreenRecorder-Linux-x64.deb
            dist/ScreenRecorder-Linux-x64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: screenshots/
          if-no-files-found: ignore

  macos:
    name: Build macOS .dmg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Download FFmpeg (static, Apple Silicon + Intel)
        run: |
          set -euo pipefail
          mkdir -p ffmpeg_mac && cd ffmpeg_mac
          for arch in arm64 amd64; do
            curl -fsSL -o "ffmpeg-$arch.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/ffmpeg.zip"
            mkdir -p "$arch" && unzip -o -q "ffmpeg-$arch.zip" -d "$arch"
          done
          lipo -create arm64/ffmpeg amd64/ffmpeg -output ffmpeg
          chmod 755 ffmpeg
          lipo -info ffmpeg
          ./ffmpeg -hide_banner -version | head -1
          ./ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "libx264|h264_videotoolbox" || true
          echo "$PWD" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Unit tests on macOS
        shell: bash
        # Reported, but don't stop the .dmg build (Windows/Linux run the full suite).
        continue-on-error: true
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded test/cross_platform_test.dart test/auto_zoom_test.dart 2>&1 | tee test-output.txt; then
            msg=$(grep -nE "\[E\]|Expected:|Actual:|Which:|EXCEPTION|Error:|error:|Test failed|ProcessException|══" test-output.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=macOS test failures::${msg}"
            exit 1
          fi
      - name: List capture devices (no Screen Recording permission on CI is expected)
        continue-on-error: true
        run: ffmpeg_mac/ffmpeg -hide_banner -f avfoundation -list_devices true -i "" || true
      - name: Build Flutter app
        run: flutter build macos --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }}
      - name: Add FFmpeg, sign (ad-hoc) and make the .dmg
        run: packaging/macos/package.sh ffmpeg_mac/ffmpeg dist
      - name: Start the app (smoke test)
        continue-on-error: true
        run: |
          mkdir -p screenshots
          "build/macos/Build/Products/Release/Screen Recorder.app/Contents/MacOS/Screen Recorder" \
            --demo=home --demo-assets="$PWD/tool/demo" > app.log 2>&1 &
          sleep 20
          screencapture -x screenshots/macos-home.png || true
          kill %1 || true
          tail -n 40 app.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/ScreenRecorder-macOS.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-screenshots
          path: screenshots/
          if-no-files-found: ignore

  publish:
    name: Publish downloads
    needs: [checks, windows, linux, macos]
    # Windows must succeed; Mac/Linux are added when their builds succeed.
    if: always() && needs.windows.result == 'success' && needs.checks.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and write the update manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.png' \) -exec cp {} dist/ \;
          base="https://github.com/${{ github.repository }}/releases/download/windows-latest"
          dl() { [ -f "dist/$2" ] && printf '"%s": "%s/%s"' "$1" "$base" "$2"; }
          downloads=$(for pair in "macos ScreenRecorder-macOS.dmg" "linux_deb ScreenRecorder-Linux-x64.deb" "linux_tar ScreenRecorder-Linux-x64.tar.gz"; do set -- $pair; dl "$1" "$2" || true; echo; done | sed '/^$/d' | paste -sd, -)
          cat > dist/version.json <<JSON
          {
            "build": ${{ github.run_number }},
            "version": "1.0.${{ github.run_number }}",
            "installer": "$base/ScreenRecorder-Setup.exe",
            "downloads": { $downloads },
            "commit": "${{ github.sha }}"
          }
          JSON
          python3 -m json.tool dist/version.json
          ls -la dist
      - name: Publish to the "windows-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Screen Recorder (latest build)
          body: |
            **Windows:** ScreenRecorder-Setup.exe. Run it; a Screen Recorder shortcut appears on your desktop.
            **macOS (Apple Silicon and Intel):** ScreenRecorder-macOS.dmg. Drag the app to Applications. First open: System Settings → Privacy & Security → Open Anyway.
            **Linux (Ubuntu 24.04+ / Debian 13+):** ScreenRecorder-Linux-x64.deb, or the .tar.gz for other distros (needs ffmpeg and libmpv).

            Build ${{ github.run_number }} from ${{ github.sha }}.
          files: |
            dist/*
          make_latest: true
