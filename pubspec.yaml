name: screen_recorder_app
description: Native Linux desktop screen-region recorder using Flutter and FFmpeg.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Window size, position, always-on-top, and frameless overlay on Linux.
  # Runtime dependency. Linux is a first-class supported platform.
  window_manager: ^0.5.1

  # Monitor bounds, offsets, and scale factors for mapping overlay
  # coordinates to real desktop pixels. Runtime dependency. Supports Linux.
  # Also pulled in transitively by window_manager; declared directly because
  # we use its API.
  screen_retriever: ^0.2.0

  # Native GTK save-file dialog on Linux (directory, filename, type).
  # Runtime dependency. Official Flutter plugin with Linux support.
  file_selector: ^1.0.3

  # Path joining for temp segments and output files. Runtime Dart library.
  path: ^1.9.1

  # Session-bus client for the XDG Screenshot portal on Wayland.
  # Runtime Dart library (Unix socket); no extra native packages.
  dbus: ^0.7.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
